[workspace]
resolver = "3"
members = []

[workspace.package]
authors = ["wenxig"]
edition = "2024"
license = "MIT"
repository = "https://github.com/wenxig/zero-path"
rust-version = "1.97.1"
version = "1.0.0"

[workspace.dependencies]

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
incremental = true

[profile.dev.package."*"]
opt-level = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
debug = false
incremental = true